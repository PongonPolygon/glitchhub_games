        <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: gray;
                flex-direction: column;
                font-family: sans-serif;
            }

            .controls {
                position: absolute;
                bottom: 20px;
                background: rgba(255,255,255,0.85);
                padding: 20px;
                border-radius: 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                width: 300px;
            }

            textarea {
                resize: none;
                height: 60px;
            }
        </style>
    </head>
    <body>

    <script src="https://cdn.jsdelivr.net/gh/PongonPolygon/glitchhub_games@main/iseeyou/loader.js"></script>

    <div id="eyesMount"></div>

    <div class="controls">
        <label>
            Size:
            <input type="range" id="size" min="0.5" max="5" step="0.1" value="2">
        </label>

        <label>
            Gap:
            <input type="range" id="gap" min="10" max="200" step="5" value="50">
        </label>

        <textarea id="embedCode" readonly></textarea>
    </div>

    <script>
    let size = 2;
    let gap = 50;

    let instance;

    function updateEmbed() {
        document.getElementById("embedCode").value =
    `<script src="https://cdn.jsdelivr.net/gh/PongonPolygon/glitchhub_games@main/iseeyou/loader.js"><\/script>
    <script>
      ISeeYou.create({ size: ${size}, gap: ${gap} });
    <\/script>`;
    }

    window.addEventListener("ISeeYouReady", () => {
        instance = ISeeYou.create({
            size,
            gap,
            mount: document.getElementById("eyesMount")
        });
        updateEmbed();
    });

    document.getElementById("size").addEventListener("input", e => {
        size = e.target.value;
        instance.update({ size });
        updateEmbed();
    });

    document.getElementById("gap").addEventListener("input", e => {
        gap = e.target.value;
        instance.update({ gap });
        updateEmbed();
    });
    </script>

    </body>
</html>
