        <style>@import url("https://fonts.googleapis.com/css?family=Bpmf+Huninn");</style>
    </head>
    <body style="overflow: hidden; background-color: gray; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">
        
        <script id="eyes" src="eyes.js?size=2&gap=50"></script>
        
        <a id="openEmbeder" style="font-size: 25px; color: #202020; font-family: 'Bpmf Huninn'; user-select: none; position: absolute; bottom: 10px;">Embed into your own site!</a>
        
        <div id="embedBody" style="opacity: 0.85; display: none; width: 50vw; height: 40vh; background-color: darkgray; border-width: 5px; border-color: black; border-style: solid; border-radius: 25px; position: absolute;">
            <button id="closeButton" type="button" style="user-select: none; border-radius: 20px; width: 5%; aspect-ratio: 1/1; font-size: 100%; font-family: 'Bpmf Huninn'; background-color: gray; border-color: black;">X</button>
            <div style="display: flex; flex-direction: column; align-content: center; align-items: center; height: 100%; width: 100%;">
                <p id="sizeText" style="font-family: 'Bpmf Huninn';"><u>Size: 2</u></p>
                <input style="width: 75%;" type="range" id="sizeSlider" name="sizeSlider" min="0.1" max="5" value="2" step="0.1">
                <p id="gapText" style="font-family: 'Bpmf Huninn';"><u>Gap Size: 50</u></p>
                <input style="width: 75%;" type="range" id="gapSlider" name="gapSlider" min="10" max="200" value="50" step="5">
                &nbsp;
                <textarea onclick="this.select();" rows="2" id="outputScript" name="outputScript" readonly style="word-break: break-all; resize: none; border: none; outline: none; font-family: 'Bpmf Huninn'; width: 85%; font-size: 20px; border-radius: 5px; background-color: lightgray; text-align: justify;"></textarea>
                &nbsp;
                <button id="copyButton" type="button" style="font-family: 'Bpmf Huninn'; font-size: 25px; border-radius: 20px; background-color: lightgray;">Copy Code</button>
                <p style="font-family: 'Bpmf Huninn';">Copy and paste this code in your page to add the eyes!</p>
            </div>
        </div>
        
        <script>
            let sizeVal = 2;
            let gapVal = 50;
            
            document.getElementById("outputScript").value = `<script src="https://raw.githubusercontent.com/PongonPolygon/glitchhub_games/refs/heads/main/iseeyou/eyes.js?size=${sizeVal}&gap=${gapVal}"><\/script>`;
            
            document.getElementById("openEmbeder").addEventListener("mouseenter", (event) => {
                document.getElementById("openEmbeder").style.color = "#3a3a3a";
            });
            
            document.getElementById("openEmbeder").addEventListener("mouseleave", (event) => {
                document.getElementById("openEmbeder").style.color = "#202020";
            });
            
            document.getElementById("openEmbeder").onclick = function () {
                document.getElementById("embedBody").style.display = "block";
            }
            
            document.getElementById("closeButton").addEventListener("click", function() {
                document.getElementById("embedBody").style.display = "none";
            });
            
            document.getElementById("sizeSlider").addEventListener("input", function() {
                sizeVal = document.getElementById("sizeSlider").value;
                document.getElementById("sizeText").textContent = "Size: " + sizeVal;
                
                document.getElementById("eyes").src = `eyes.js/?size=${sizeVal}&gap=${gapVal}`;
                document.getElementById("outputScript").value = `<script src="https://raw.githubusercontent.com/PongonPolygon/glitchhub_games/refs/heads/main/iseeyou/eyes.js?size=${sizeVal}&gap=${gapVal}"><\/script>`;
            });
            document.getElementById("gapSlider").addEventListener("input", function() {
                gapVal = document.getElementById("gapSlider").value;
                document.getElementById("gapText").textContent = "Gap Size: " + gapVal;
                
                document.getElementById("eyes").src = `eyes.js/?size=${sizeVal}&gap=${gapVal}`;
                document.getElementById("outputScript").value = `<script src="https://raw.githubusercontent.com/PongonPolygon/glitchhub_games/refs/heads/main/iseeyou/eyes.js?size=${sizeVal}&gap=${gapVal}"><\/script>`;
            });
            
            document.getElementById("copyButton").addEventListener("click", async() => {
                const text = document.getElementById("outputScript").value;
                
                try {
                    await navigator.clipboard.writeText(text);
                    checkCopy();
                } catch (err) {
                    console.error("Error copying");
                }
            });
            
            function checkCopy() {
                let timerTime = 1;
                const button = document.getElementById("copyButton");
                
                button.textContent = "Copied!"
                button.style.backgroundColor = "palegreen";
                
                let timer = setInterval(() => {
                    
                    timerTime -= 1
                    
                    if (timerTime <= 0) {
                        button.textContent = "Copy Code"
                        button.style.backgroundColor = "lightgray";
                        clearInterval(timer);
                    }
                }, 1000)
            }
        </script>
    </body>
</html>
